<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Toolkit — módulos</title>
  <link rel="stylesheet" href="popup.css">
  <script src="I18n.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header><img src="icons/icon-48.png" alt="" width="40" height="40"><div><h1>Toolkit</h1><p data-i18n="subtitle">Tools for Azure DevOps</p></div></header>
  <main>
    <h2 data-i18n="modules">Your modules</h2>
    <label><span><strong data-i18n="copyTask">Copy in work items</strong><small data-i18n="copyTaskHelp"></small></span><input type="checkbox" id="copyTask" disabled></label>
    <label><span><strong data-i18n="copyPr">Copy in pull requests</strong><small data-i18n="copyPrHelp"></small></span><input type="checkbox" id="copyPr" disabled></label>
    <label><span><strong data-i18n="projects">Show projects</strong><small data-i18n="projectsHelp"></small></span><input type="checkbox" id="projects" disabled></label>
    <p id="status" data-i18n="loading" role="status" aria-live="polite"></p>
    <p class="hint" data-i18n="refreshHint"></p>
    <section class="updates" aria-label="Atualizações">
      <div class="update-heading"><strong data-i18n="updates">Updates</strong><span id="version"></span></div>
      <p class="hint" data-i18n="autoUpdates"></p>
      <button type="button" id="check-update" data-i18n="checkUpdate">Check for updates</button>
      <p id="update-status" role="status" aria-live="polite"></p>
      <details><summary data-i18n="localInstall"></summary><p class="hint" data-i18n="localHelp"></p></details>
    </section>
  </main>
</body>
</html>
